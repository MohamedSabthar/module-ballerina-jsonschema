pluginManagement {
    plugins {
        id "com.github.spotbugs-base" version "${spotbugsPluginVersion}"
        id "com.github.johnrengelman.shadow" version "${shadowJarPluginVersion}"
        id "de.undercouch.download" version "${downloadPluginVersion}"
        id "net.researchgate.release" version "${releasePluginVersion}"
        id "io.ballerina.plugin" version "${ballerinaGradlePluginVersion}"
    }

    repositories {
        gradlePluginPortal()
        maven {
            url = 'https://maven.pkg.github.com/ballerina-platform/*'
            credentials {
                username System.getenv("packageUser")
                password System.getenv("packagePAT")
            }
        }
    }
}

rootProject.name = 'jsonschema'

include ':checkstyle'
include ':jsonschema-native'
include ':jsonschema-ballerina'
include ':jsonschema-ballerina-tests'
include ':jsonschema-compiler-plugin'
include ':jsonschema-compiler-plugin-tests'

project(':checkstyle').projectDir = file("build-config${File.separator}checkstyle")
project(':jsonschema-native').projectDir = file('native')
project(':jsonschema-ballerina').projectDir = file('ballerina')
project(':jsonschema-ballerina-tests').projectDir = file("ballerina-tests")
project(':jsonschema-compiler-plugin').projectDir = file('compiler-plugin')
project(':jsonschema-compiler-plugin-tests').projectDir = file("compiler-plugin-tests")
